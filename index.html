<!doctype html>

  <head>
    <script>
      // Gracefully handle Vite dev-server WebSocket HMR runner in preview environment
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1))
            ) {
              var dummy = new EventTarget();
              dummy.close = function() {};
              dummy.send = function() {};
              dummy.readyState = 1; // OPEN
              dummy.addEventListener = EventTarget.prototype.addEventListener.bind(dummy);
              dummy.removeEventListener = EventTarget.prototype.removeEventListener.bind(dummy);
              dummy.dispatchEvent = EventTarget.prototype.dispatchEvent.bind(dummy);
              setTimeout(function() {
                dummy.dispatchEvent(new Event('open'));
              }, 5);
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('[vite]') !== -1 || text.indexOf('ModuleRunner') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          var msg = (e && e.message) || '';
          var file = (e && e.filename) || '';
          if (
            file.indexOf('@vite/client') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('ModuleRunner') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('ModuleRunner') !== -1 ||
            msg.indexOf('[vite]') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
