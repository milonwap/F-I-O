<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friend Initiative Organization</title>
    <meta name="description" content="Comprehensive cooperative society management platform for tracking member savings kisti, loans, project investments, and committee task workflows." />
    <meta property="og:title" content="Friend Initiative Organization" />
    <meta property="og:description" content="Comprehensive cooperative society management platform for tracking member savings kisti, loans, project investments, and committee task workflows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Gracefully ignore benign Vite WebSocket/HMR runner errors in preview environment
      window.addEventListener('error', function (e) {
        if (
          (e.filename && e.filename.indexOf('@vite/client') !== -1) ||
          (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ModuleRunner') !== -1))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = reason && (reason.message || String(reason));
        var stack = (reason && reason.stack) || '';
        if (
          (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ModuleRunner') !== -1)) ||
          stack.indexOf('@vite/client') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
