<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.2" />

  <!-- Central Shield / Growth Emblem with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Emblem Shield -->
    <path d="M 256,96 C 330,96 384,128 384,208 C 384,310 290,378 256,408 C 222,378 128,310 128,208 C 128,128 182,96 256,96 Z"
          fill="#065f46" stroke="url(#goldGrad)" stroke-width="10" />

    <!-- Sprouting Leaves / Growth -->
    <path d="M 256,290 C 256,220 200,190 200,190 C 200,240 230,270 256,290 Z" fill="url(#leafGrad)" />
    <path d="M 256,290 C 256,200 316,170 316,170 C 316,230 282,266 256,290 Z" fill="url(#goldGrad)" />

    <!-- Golden Coin in Center -->
    <circle cx="256" cy="316" r="24" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
    <text x="256" y="324" font-family="sans-serif" font-size="22" font-weight="900" fill="#78350f" text-anchor="middle">৳</text>
  </g>

  <!-- Typography: FIO -->
  <text x="256" y="460" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">FIO</text>
</svg>